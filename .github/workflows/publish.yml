name: publish
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tag must match croqui.__version__
        run: test "v$(python -c 'import croqui; print(croqui.__version__)')" = "$GITHUB_REF_NAME"
      - run: pipx run build
      - run: pipx run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
